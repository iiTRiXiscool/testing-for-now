<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Koxyos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1815; --bone:#EDE6D6; --bone-dim:#B2A996; --brass:#C89B3C;
    --line: rgba(237,230,214,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--ink);color:var(--bone);
    font-family:'Work Sans',sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    opacity:0; transition:opacity 0.32s ease;
  }
  body.page-in{opacity:1;}
  body.page-out{opacity:0;}
  @media (prefers-reduced-motion: reduce){
    body{transition:none; opacity:1;}
  }
  .code{font-family:'Space Mono',monospace;color:var(--brass);font-size:0.95rem;letter-spacing:0.15em;margin-bottom:14px;}
  h1{font-family:'Big Shoulders Display',sans-serif;font-size:clamp(2.4rem,8vw,4rem);margin:0 0 14px;}
  h1 em{color:var(--brass);font-style:normal;}
  p{color:var(--bone-dim);max-width:40ch;margin:0 auto 30px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{padding:13px 22px;border-radius:3px;font-weight:700;font-size:0.9rem;text-decoration:none;}
  .btn.solid{background:var(--brass);color:var(--ink);}
  .btn.outline{border:1px solid var(--line);color:var(--bone);}
</style>
</head>
<body>
  <div>
    <div class="code" data-i18n="code">ERROR 404</div>
    <h1 data-i18n="heading">Wrong <em>chair</em>.</h1>
    <p data-i18n="body">That page got a haircut and isn't here anymore. Let's get you back to the right seat.</p>
    <div class="btns">
      <a class="btn solid" href="index.html" data-i18n="home">Back to home</a>
      <a class="btn outline" href="barbershop-booking.html" data-i18n="book">Book an appointment</a>
    </div>
  </div>
  <script>
    window.I18N_DICT = {
      en: {
        __docTitle: "Page not found — Koxyos",
        code: "ERROR 404",
        heading: "Wrong <em>chair</em>.",
        body: "That page got a haircut and isn't here anymore. Let's get you back to the right seat.",
        home: "Back to home",
        book: "Book an appointment"
      },
      fr: {
        __docTitle: "Page introuvable — Koxyos",
        code: "ERREUR 404",
        heading: "Mauvais <em>fauteuil</em>.",
        body: "Cette page a pris une coupe et n'est plus là. Revenons au bon fauteuil.",
        home: "Retour à l'accueil",
        book: "Prendre rendez-vous"
      }
    };
  </script>
  <script src="i18n.js"></script>
  <script>
    window.addEventListener('pageshow', function(){
      document.body.classList.remove('page-out');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ document.body.classList.add('page-in'); });
      });
    });
    document.querySelectorAll('a[href]').forEach(function(link){
      const href = link.getAttribute('href');
      if(!href || href.charAt(0) === '#') return;
      if(link.target === '_blank') return;
      if(/^(https?:|mailto:|tel:)/.test(href)) return;
      link.addEventListener('click', function(e){
        if(e.metaKey || e.ctrlKey || e.shiftKey) return;
        e.preventDefault();
        document.body.classList.remove('page-in');
        document.body.classList.add('page-out');
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(function(){ window.location.href = href; }, reduce ? 0 : 300);
      });
    });
  </script>
</body>
</html>
