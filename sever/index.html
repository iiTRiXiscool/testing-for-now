<style>
  :root{
    --ink:#1B1815; --ink-soft:#211D17; --ink-card:#28221B;
    --bone:#EDE6D6; --bone-dim:#B2A996;
    --brass:#C89B3C; --brass-dim:#A6883F;
    --rust:#8C3B2E;
    --line: rgba(237,230,214,0.14);
    --line-strong: rgba(237,230,214,0.26);
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--ink);color:var(--bone);font-family:'Work Sans',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity 0.32s ease;}
  body.page-in{opacity:1;}
  body.page-out{opacity:0;}
  @media (prefers-reduced-motion: reduce){
    body{transition:none; opacity:1;}
  }
  h1{font-family:'Big Shoulders Display',sans-serif;font-weight:700;margin:0;letter-spacing:0.01em;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  @media (max-width:600px){.wrap{padding:0 18px;}}

  /* ---------- full-bleed hero ---------- */
  .splash{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    /* Layer order (top to bottom): dark scrim for text legibility, an optional
       real shop photo (drop a file named hero-photo.jpg alongside this page
       and it takes over automatically), then a charcoal/barber-pole fallback
       backdrop that's used until a real photo is added. */
    background-image:
      linear-gradient(180deg, rgba(15,13,10,0.55) 0%, rgba(15,13,10,0.72) 100%),
      url('hero-photo.jpg'),
      radial-gradient(circle at 82% 12%, rgba(200,155,60,0.16), transparent 42%),
      linear-gradient(160deg, #241F19 0%, #17140F 100%);
    background-size: cover, cover, cover, cover;
    background-position: center, center, center, center;
    background-repeat: no-repeat;
  }
  .splash-pole{
    position:absolute; top:-90px; right:-90px;
    width:340px; height:340px; border-radius:50%;
    opacity:0.12;
    background:repeating-linear-gradient(55deg,var(--rust) 0 20px,var(--bone) 20px 40px,var(--brass) 40px 60px);
    pointer-events:none;
  }

  /* ---------- overlay header ---------- */
  .splash-header{position:relative; z-index:5; padding:22px 0;}
  .splash-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .logo-mark{display:block;height:40px;width:auto;}
  nav{display:flex;gap:22px;font-size:0.9rem;color:var(--bone-dim);}
  nav a:hover{color:var(--bone);}
  .head-right{display:flex;align-items:center;gap:14px;}
  .social-row{display:flex;gap:10px;align-items:center;}
  .social-row a{display:flex;align-items:center;justify-content:center;padding:0;border:none;background:none;}
  .social-row a img{display:block;width:22px;height:22px;object-fit:contain;filter:brightness(0.9);transition:transform 0.2s ease, filter 0.2s ease;}
  .social-row a:hover img{filter:brightness(1.1);transform:translateY(-1px);}
  .head-cta{background:var(--brass);color:var(--ink);padding:9px 18px;border-radius:var(--radius);font-weight:700;font-size:0.85rem;}
  .nav-toggle{display:none;background:none;border:1px solid rgba(237,230,214,0.35);color:var(--bone);padding:8px 12px;border-radius:var(--radius);font-size:1.1rem;line-height:1;cursor:pointer;}
  @media (max-width:820px){ nav{display:none;} .nav-toggle{display:block;} }
  .mobile-nav-panel{display:none;flex-direction:column;position:relative;z-index:5;background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .mobile-nav-panel.open{display:flex;}
  .mobile-nav-panel a{padding:16px 24px;color:var(--bone);border-bottom:1px solid var(--line);font-size:0.95rem;}
  .mobile-nav-panel a:last-child{border-bottom:none;}

  /* ---------- hero content ---------- */
  .splash-body{
    position:relative; z-index:4;
    flex:1;
    display:flex;
    align-items:center;
    padding:40px 0 90px;
  }
  .eyebrow{font-family:'Space Mono',monospace;color:var(--brass);font-size:0.82rem;margin-bottom:18px;}
  .splash-body h1{font-size:clamp(2.6rem,6.4vw,4.6rem);line-height:1.02;max-width:15ch;}
  .splash-body p{color:var(--bone-dim);max-width:46ch;font-size:1.05rem;margin:20px 0 0;}
  .splash-cta{display:inline-block;margin-top:32px;background:var(--brass);color:var(--ink);border:none;padding:15px 28px;border-radius:var(--radius);font-weight:700;font-size:0.95rem;}
  .splash-cta:hover{background:#DCAE4E;}

  .scroll-hint{
    position:relative; z-index:4;
    padding-bottom:28px;
    display:flex; align-items:center; gap:10px;
    color:var(--bone-dim); font-family:'Space Mono',monospace; font-size:0.72rem;
  }
  .scroll-hint .line{width:32px;height:1px;background:var(--line-strong);}
</style>
</head>
<body>

  <section class="splash">
    <div class="splash-pole"></div>

    <header class="splash-header">
      <div class="wrap">
        <a href="index.html"><img class="logo-mark" src="koxyos-logo.png" alt="Koxyos"></a>
        <nav id="mainNav">
          <a href="cutthroat-accueil.html#services" data-i18n="nav_services">Services</a>

    </header>
    <div id="mobileNavPanel" class="mobile-nav-panel">
      <a href="cutthroat-accueil.html#services" onclick="closeMobileNav()" data-i18n="nav_services">Services</a>
      <a href="cutthroat-accueil.html#about" onclick="closeMobileNav()" data-i18n="nav_about">About</a>

    </div>

    <div class="splash-body">
      <div class="wrap">
        <div class="eyebrow" data-i18n="eyebrow">Barbershop — Tangier</div>
        <h1 data-i18n="hero_h1">A proper cut, every time you sit down.</h1>

<script src="i18n.js"></script>
<script>
  function toggleMobileNav(){
    const panel = document.getElementById('mobileNavPanel');
    const btn = document.getElementById('navToggle');
    const isOpen = panel.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  }
  function closeMobileNav(){
    document.getElementById('mobileNavPanel').classList.remove('open');
    document.getElementById('navToggle').setAttribute('aria-expanded', 'false');
  }

  // Page fade transitions: fade in on load, fade out before navigating away.
  window.addEventListener('pageshow', function(){
    document.body.classList.remove('page-out');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ document.body.classList.add('page-in'); });
    });
  });
  document.querySelectorAll('a[href]').forEach(function(link){
    const href = link.getAttribute('href');
    if(!href || href.charAt(0) === '#') return;
    if(link.target === '_blank') return;
    if(/^(https?:|mailto:|tel:)/.test(href)) return;
    link.addEventListener('click', function(e){
      if(e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      document.body.classList.remove('page-in');
      document.body.classList.add('page-out');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function(){ window.location.href = href; }, reduce ? 0 : 300);
    });
  });
</script>
